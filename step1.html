<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step 1</title>
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --border: rgba(255, 255, 255, 0.85);
      --muted: rgba(255, 255, 255, 0.72);
      --button: #b33434;
      --button-hover: #962828;
      --button-disabled: #4f2323;
      --max-width: 920px;
      --card-bg: #0d0d0d;
      --input-bg: #111111;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: var(--max-width);
      border: 1px solid var(--border);
      padding: 40px 24px;
    }

    .inner {
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 5vw, 3.75rem);
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .subheadline {
      margin: 0 0 32px;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.6;
      color: var(--muted);
    }

    .form-shell {
      border: 1px solid var(--border);
      background: var(--card-bg);
      padding: 24px 20px;
      text-align: left;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.9rem;
      color: var(--text);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    input {
      width: 100%;
      padding: 14px 14px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: var(--input-bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.42);
    }

    input:focus {
      border-color: rgba(255, 255, 255, 0.85);
    }

    .cta {
      display: inline-block;
      width: 100%;
      padding: 16px 28px;
      background: var(--button);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: none;
      transition: background 0.2s ease, opacity 0.2s ease;
      cursor: pointer;
      margin-top: 8px;
    }

    .cta:hover:not(:disabled) {
      background: var(--button-hover);
    }

    .cta:disabled {
      background: var(--button-disabled);
      opacity: 0.55;
      cursor: not-allowed;
    }

    .disclaimer {
      margin-top: 14px;
      font-size: 0.82rem;
      line-height: 1.6;
      color: var(--muted);
      text-align: center;
    }

    .hidden-field {
      display: none;
    }

    @media (max-width: 640px) {
      .wrap {
        padding: 28px 18px;
      }

      .subheadline {
        margin-bottom: 24px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="inner">
      <h1>Get Instant Access to The Futures Trading Video Series 100% FREE</h1>
      <p class="subheadline">Fill out the form below while you can.</p>

    <form method="POST" action="/.netlify/functions/send-lead" id="accessForm" class="form-shell">
        <input type="hidden" name="form-name" value="futures-video-access" />

        <p class="hidden-field">
          <label>Don’t fill this out if you're human: <input name="bot-field" /></label>
        </p>

        <div class="form-grid">
          <div class="field">
            <label for="firstName">First Name</label>
            <input
              type="text"
              id="firstName"
              name="first_name"
              placeholder="Enter your first name"
              autocomplete="given-name"
              required
            />
          </div>

          <div class="field">
            <label for="lastName">Last Name</label>
            <input
              type="text"
              id="lastName"
              name="last_name"
              placeholder="Enter your last name"
              autocomplete="family-name"
              required
            />
          </div>

          <div class="field full">
            <label for="emailAddress">Primary Email Address</label>
            <input
              type="email"
              id="emailAddress"
              name="email"
              placeholder="Enter your primary email address"
              autocomplete="email"
              required
            />
          </div>

          <div class="field full">
            <label for="cellPhone">Cell Phone Number</label>
          <input type="tel" id="cellPhone" name="cell_phone" placeholder="Enter your cell phone number" inputmode="numeric"
            pattern="[0-9]{10,12}" minlength="10" maxlength="12" autocomplete="tel" required />
          </div>
        </div>

        <button class="cta" type="submit" id="submitButton" disabled>
          YES! I Want Instant Access
        </button>

        <p class="disclaimer">
          We respect your privacy and will never share, rent, or sell your information.
          By submitting this form, you agree to receive communications related to this offer.
          No spam. Ever.
        </p>
      </form>
    </section>
  </main>

 <script>
  const form = document.getElementById('accessForm');
  const submitButton = document.getElementById('submitButton');
  const firstName = document.getElementById('firstName');
  const lastName = document.getElementById('lastName');
  const emailAddress = document.getElementById('emailAddress');
  const cellPhone = document.getElementById('cellPhone');

  function validateForm() {
    const firstNameValid = firstName.value.trim() !== '';
    const lastNameValid = lastName.value.trim() !== '';
    const emailValid = emailAddress.value.trim() !== '';
    const phoneDigits = cellPhone.value.replace(/\D/g, '');
    const phoneValid = phoneDigits.length >= 10 && phoneDigits.length <= 12;

    submitButton.disabled = !(firstNameValid && lastNameValid && emailValid && phoneValid);
  }

  cellPhone.addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '').slice(0, 12);
    validateForm();
  });

  [firstName, lastName, emailAddress, cellPhone].forEach(field => {
    field.addEventListener('input', validateForm);
    field.addEventListener('blur', validateForm);
  });

  form.addEventListener('submit', function (e) {
    const phoneDigits = cellPhone.value.replace(/\D/g, '');
    if (phoneDigits.length < 10 || phoneDigits.length > 12) {
      e.preventDefault();
      alert('Please enter a valid cell phone number with 10 to 12 digits.');
      cellPhone.focus();
    }
  });

  validateForm();
</script>
</body>
</html>
