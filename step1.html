<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step 1</title>
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --border: rgba(255, 255, 255, 0.85);
      --muted: rgba(255, 255, 255, 0.72);
      --button: #b33434;
      --button-hover: #962828;
      --button-disabled: #4f2323;
      --max-width: 920px;
      --card-bg: #0d0d0d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: var(--max-width);
      border: 1px solid var(--border);
      padding: 40px 24px;
    }

    .inner {
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 5vw, 3.75rem);
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .subheadline {
      margin: 0 0 32px;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.6;
      color: var(--muted);
    }

    .options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 0 0 28px;
    }

    .option-card {
      border: 1px solid var(--border);
      background: var(--card-bg);
      padding: 18px 14px 20px;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .option-card:hover {
      transform: translateY(-2px);
    }

    .option-card.selected {
      border-color: #ffffff;
      background: #141414;
    }

    .option-card label {
      display: block;
      cursor: pointer;
    }

    .food-image {
      width: 140px;
      height: 140px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: #111111;
      font-size: 4rem;
      line-height: 1;
    }

    .food-name {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .selector {
      width: 20px;
      height: 20px;
      accent-color: #b33434;
      cursor: pointer;
    }

    .cta {
      display: inline-block;
      padding: 14px 28px;
      background: var(--button);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: none;
      transition: background 0.2s ease, opacity 0.2s ease;
      cursor: pointer;
    }

    .cta:hover:not(:disabled) {
      background: var(--button-hover);
    }

    .cta:disabled {
      background: var(--button-disabled);
      opacity: 0.55;
      cursor: not-allowed;
    }

    @media (max-width: 800px) {
      .options {
        grid-template-columns: 1fr;
      }

      .food-image {
        width: 120px;
        height: 120px;
      }

      .cta {
        width: 100%;
      }
    }

    @media (max-width: 640px) {
      .wrap {
        padding: 28px 18px;
      }

      .subheadline {
        margin-bottom: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="inner">
      <h1>Pick Your Dinner Option</h1>
      <p class="subheadline">Only one option can be chosen.</p>

      <form action="/.netlify/functions/send-selection" method="POST" id="stepForm">
        <input type="hidden" name="selection_time_et" id="selectionTimeET" value="" />

        <div class="options">
          <div class="option-card">
            <label>
              <div class="food-image" aria-hidden="true">🍕</div>
              <div class="food-name">Pizza</div>
              <input class="selector" type="radio" name="dinner" value="Pizza" />
            </label>
          </div>

          <div class="option-card">
            <label>
              <div class="food-image" aria-hidden="true">🍝</div>
              <div class="food-name">Pasta</div>
              <input class="selector" type="radio" name="dinner" value="Pasta" />
            </label>
          </div>

          <div class="option-card">
            <label>
              <div class="food-image" aria-hidden="true">🍣</div>
              <div class="food-name">Sushi Roll</div>
              <input class="selector" type="radio" name="dinner" value="Sushi Roll" />
            </label>
          </div>
        </div>

        <button class="cta" type="submit" id="nextStep" disabled>Next Step</button>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById('stepForm');
    const radios = form.querySelectorAll('input[type="radio"]');
    const nextButton = document.getElementById('nextStep');
    const cards = form.querySelectorAll('.option-card');
    const timeField = document.getElementById('selectionTimeET');

    function getEasternTimeString() {
      return new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/New_York',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hour12: true,
        timeZoneName: 'short'
      }).format(new Date());
    }

    function updateSelectionState() {
      let hasSelection = false;

      radios.forEach((radio, index) => {
        const selected = radio.checked;
        cards[index].classList.toggle('selected', selected);
        if (selected) hasSelection = true;
      });

      nextButton.disabled = !hasSelection;

      if (hasSelection) {
        timeField.value = getEasternTimeString();
      }
    }

    radios.forEach((radio) => {
      radio.addEventListener('change', updateSelectionState);
    });

    form.addEventListener('submit', () => {
      timeField.value = getEasternTimeString();
    });

    updateSelectionState();
  </script>
</body>
</html>
